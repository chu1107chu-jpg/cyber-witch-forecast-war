seed: 42
device: cpu

tickers:
  - AAPL
  - MSFT
  - GOOGL
  - TSLA
  - BTC-USD
  - ETH-USD

horizons:
  r1: 1       # next-day return
  R20: 20     # 20-day cumulative return

data:
  history_years: 10
  news_years: 5           # для аналитики крупных новостей
  train_ratio: 0.7
  val_ratio: 0.15
  rolling_cv_splits: 5

features:
  price:
    windows: [1, 3, 5, 10, 20, 60]
    include: [log_return, rolling_std, rolling_vol, sma, ema, rsi, macd, atr, volume_anomaly]
  news:
    sentiment_model: "ProsusAI/finbert"
    embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
    embedding_dim: 384
    impulse_window: 1      # max|sent| за сутки
    chain_windows: [3, 7]
    decay_half_life_h: 24
    deduplicate: true

sklearn_baseline:
  models:
    - name: linear_regression
      type: Ridge
      alpha: 1.0
    - name: elastic_net
      alpha: 0.01
      l1_ratio: 0.5
    - name: logistic
      C: 1.0
    - name: random_forest
      n_estimators: 200
      max_depth: 6
    - name: extra_trees
      n_estimators: 200

tf_models:
  lstm:
    units: [64, 32]
    dropout: 0.2
    seq_len: 20
    batch_size: 64
    epochs: 30
    early_stopping_patience: 5
  tcn:
    filters: 64
    kernel_size: 3
    dilations: [1, 2, 4, 8]
    batch_size: 64
    epochs: 30

torch_models:
  mlp:
    hidden: [256, 128, 64]
    dropout: 0.2
    lr: 1e-3
    batch_size: 64
    epochs: 40
  transformer_lite:
    d_model: 64
    nhead: 4
    num_layers: 2
    dim_feedforward: 128
    dropout: 0.1
    lr: 5e-4
    batch_size: 32
    epochs: 30

ensemble:
  method: stacking
  meta_regressor: Ridge
  meta_classifier: LogisticRegression
  cv_folds: 5

training:
  max_time_minutes: 60
  cache_embeddings: true
  artifact_dir: data/artifacts

metrics:
  primary: [mae, brier, da]
  score_weights:
    r1_mae: 0.25
    R20_mae: 0.25
    p1_brier: 0.25
    da: 0.25

# Аналитика реакции рынка на "крупные" новости (5-летний интервал)
big_news_analysis:
  enabled: true
  lookback_years: 5
  impact_threshold_std: 2.0   # событие = возврат > 2σ
  windows_before_after: [1, 3, 5]  # дней
