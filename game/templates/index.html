<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔️ Политическая Арена</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ═══ HEADER ═══ -->
<header class="header">
  <div class="header-left">
    <span class="logo">⚔️</span>
    <h1>ПОЛИТИЧЕСКАЯ<br><span class="accent">АРЕНА</span></h1>
  </div>
  <div class="header-right">
    <div class="wallet" id="wallet">
      <span class="wallet-icon">₲</span>
      <span id="balance">100</span>
      <span class="free-badge" id="freeBadge">3 free</span>
    </div>
  </div>
</header>

<!-- ═══ SCREENS ═══ -->

<!-- SCREEN 1: Выбор бойцов -->
<section class="screen active" id="screenSelect">
  <div class="section-title">
    <h2>ВЫБЕРИ БОЙЦОВ</h2>
    <p class="subtitle">Выбери двух политиков для битвы</p>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-type="all">Все</button>
    <button class="filter-btn" data-type="Берсерк">🔥 Берсерк</button>
    <button class="filter-btn" data-type="Танк">🛡️ Танк</button>
    <button class="filter-btn" data-type="Ассасин">🗡️ Ассасин</button>
    <button class="filter-btn" data-type="Контроль">🎯 Контроль</button>
    <button class="filter-btn" data-type="Бруйзер">💪 Бруйзер</button>
    <button class="filter-btn" data-type="Саппорт">💖 Саппорт</button>
  </div>

  <div class="selected-fighters">
    <div class="selected-slot" id="slotA">
      <div class="slot-placeholder">?</div>
      <span>Боец 1</span>
    </div>
    <div class="vs-badge">VS</div>
    <div class="selected-slot" id="slotB">
      <div class="slot-placeholder">?</div>
      <span>Боец 2</span>
    </div>
  </div>

  <div class="fighters-grid" id="fightersGrid"></div>

  <button class="btn-primary btn-fight" id="btnTobet" disabled>
    ДАЛЕЕ → СТАВКА
  </button>
</section>

<!-- SCREEN 2: Ставка -->
<section class="screen" id="screenBet">
  <div class="section-title">
    <h2>СДЕЛАЙ СТАВКУ</h2>
    <p class="subtitle">На кого поставишь?</p>
  </div>

  <div class="bet-fighters">
    <div class="bet-fighter-card" id="betCardA" data-side="a">
      <div class="bet-emoji" id="betEmojiA"></div>
      <div class="bet-name" id="betNameA"></div>
      <div class="bet-type" id="betTypeA"></div>
      <div class="bet-stats" id="betStatsA"></div>
    </div>
    <div class="vs-badge vs-big">VS</div>
    <div class="bet-fighter-card" id="betCardB" data-side="b">
      <div class="bet-emoji" id="betEmojiB"></div>
      <div class="bet-name" id="betNameB"></div>
      <div class="bet-type" id="betTypeB"></div>
      <div class="bet-stats" id="betStatsB"></div>
    </div>
  </div>

  <div class="bet-controls">
    <div class="bet-amount-row">
      <label>Ставка:</label>
      <div class="bet-input-wrap">
        <button class="bet-adj" id="betMinus">−</button>
        <input type="number" id="betAmount" value="10" min="0" max="100">
        <button class="bet-adj" id="betPlus">+</button>
        <span class="currency">₲</span>
      </div>
    </div>
    <div class="bet-quick">
      <button class="bet-quick-btn" data-val="0">FREE</button>
      <button class="bet-quick-btn" data-val="5">5₲</button>
      <button class="bet-quick-btn" data-val="10">10₲</button>
      <button class="bet-quick-btn" data-val="25">25₲</button>
      <button class="bet-quick-btn" data-val="50">50₲</button>
      <button class="bet-quick-btn" data-val="100">MAX</button>
    </div>
    <div class="bet-info">
      <span>Выигрыш: <strong id="potentialWin">x2.0</strong></span>
      <span>Баланс: <strong id="betBalance">100₲</strong></span>
    </div>
  </div>

  <div class="bet-actions">
    <button class="btn-secondary" id="btnBackSelect">← НАЗАД</button>
    <button class="btn-primary btn-fight" id="btnFight" disabled>⚔️ В БОЙ!</button>
  </div>
</section>

<!-- SCREEN 3: Бой -->
<section class="screen" id="screenFight">
  <div class="fight-arena">
    <div class="fight-header">
      <div class="fight-fighter fight-left">
        <div class="fight-emoji" id="fightEmojiA"></div>
        <div class="fight-name" id="fightNameA"></div>
        <div class="hp-bar"><div class="hp-fill" id="hpBarA"></div></div>
        <div class="hp-text" id="hpTextA"></div>
      </div>
      <div class="fight-round" id="fightRound">РАУНД 1</div>
      <div class="fight-fighter fight-right">
        <div class="fight-emoji" id="fightEmojiB"></div>
        <div class="fight-name" id="fightNameB"></div>
        <div class="hp-bar"><div class="hp-fill" id="hpBarB"></div></div>
        <div class="hp-text" id="hpTextB"></div>
      </div>
    </div>
    <div class="fight-log" id="fightLog"></div>
  </div>
</section>

<!-- SCREEN 4: Результат -->
<section class="screen" id="screenResult">
  <div class="result-container">
    <div class="result-glow" id="resultGlow"></div>
    <div class="result-emoji" id="resultEmoji"></div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-winner" id="resultWinner"></div>
    <div class="result-bet" id="resultBet"></div>
    <div class="result-narration" id="resultNarration"></div>
    <div class="result-actions">
      <button class="btn-primary" id="btnPlayAgain">🔄 ЕЩЁ РАЗ</button>
    </div>
  </div>
</section>

<script src="/static/app.js"></script>
</body>
</html>
