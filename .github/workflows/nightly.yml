name: Nightly ETL + Train

on:
  schedule:
    - cron: "0 2 * * *"     # 02:00 UTC every day
  workflow_dispatch:          # manual trigger

defaults:
  run:
    working-directory: предсказания

jobs:
  etl-train:
    name: ETL → Features → Train → Upload
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      APP_ENV: production
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
      HUGGINGFACE_HUB_TOKEN: ${{ secrets.HUGGINGFACE_HUB_TOKEN }}
      WEB3_ENABLE: "false"
      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ---------- ETL ----------
      - name: Fetch quotes
        run: python scripts/run_etl.py --step fetch_quotes

      - name: Fetch news
        run: python scripts/run_etl.py --step fetch_news

      - name: Clean news
        run: python scripts/run_etl.py --step clean_news

      # ---------- Features ----------
      - name: Build features
        run: python scripts/run_etl.py --step build_features

      - name: Big-news analysis
        run: python scripts/run_etl.py --step big_news

      # ---------- Train ----------
      - name: Train models (max 50 min)
        run: python scripts/run_etl.py --step train --time-budget 3000

      # ---------- Evaluate ----------
      - name: Evaluate
        run: python scripts/run_etl.py --step evaluate

      # ---------- Upload artifacts to R2 ----------
      - name: Upload artifacts
        run: python scripts/upload_artifacts.py

      # ---------- Notify ----------
      - name: Post train summary
        if: always()
        run: |
          if [ -f data/artifacts/train_summary.json ]; then
            echo "=== Train Summary ==="
            cat data/artifacts/train_summary.json
          fi
